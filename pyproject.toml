[project]
name = "privy"
version = "0.0.1"
description = "Privy — a GDPR question-answering assistant with hybrid retrieval, built on LangGraph."
authors = [
    { name = "Privy" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "langchain-deepseek>=1.0.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.9.0",
    "langchain-postgres>=0.0.19",
    "psycopg[binary]>=3.3.6",
    "datasets>=5.1.0",
    "typesafe-sdk==0.7.4",
    "fastapi>=0.145.0",
    "uvicorn>=0.41.0",
    "aiosqlite>=0.22.1",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pyjwt>=2.15.0",
    "pwdlib[argon2]>=0.3.1",
    "chainlit==2.12.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent", "backend", "chat_ui"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"backend" = "src/backend"
"chat_ui" = "src/chat_ui"


[tool.setuptools.package-data]
"*" = ["py.typed", "*.sql"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"scripts/*" = ["D", "T201"]
"practice/*" = ["D", "T201"]
"evals/*" = ["T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]

[tool.pytest.ini_options]
# Lets the tests import the evaluation code in evals/.
pythonpath = ["."]
